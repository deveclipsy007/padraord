name: Padrão RD OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cycle-one-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend · SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, pdo_mysql, curl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer quality
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  backend-mariadb:
    name: Backend · MariaDB 11.4
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: padrao_rd_test
          MARIADB_USER: padrao
          MARIADB_PASSWORD: padrao
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, pdo_sqlite, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: scripts/ci/test-mariadb.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: padrao_rd_test
          DB_USERNAME: padrao
          DB_PASSWORD: padrao

  frontend-and-browser:
    name: Frontend · Vitest · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:ui
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  release-hostinger:
    name: Release · Hostinger package
    needs: [backend-sqlite, backend-mariadb, frontend-and-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, pdo_mysql, curl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: scripts/deploy/build-hostinger-release.sh
      - run: scripts/deploy/verify-hostinger-release.sh dist/hostinger
      - uses: actions/upload-artifact@v4
        with:
          name: padrao-rd-hostinger-release
          path: dist/hostinger
          include-hidden-files: true
          retention-days: 7
